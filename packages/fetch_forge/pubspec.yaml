    sdk: flutter
  signals: ^7.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6

topics:
  - signals
  - cache
  - reactive
