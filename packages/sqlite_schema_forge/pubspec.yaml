issue_tracker: https://github.com/albetnov/forge-flutter/issues

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

topics:
  - sqlite
  - schema
  - migration
