name: sqlite_query_forge
description: >-
  Zero-cost declarative SQLite query builder for Dart: const columns, sealed
  expressions, and every runtime value bound as a parameter instead of inlined
  into SQL.
version: 0.1.0
repository: https://github.com/albetnov/forge-flutter/tree/main/packages/sqlite_query_forge
homepage: https://github.com/albetnov/forge-flutter
issue_tracker: https://github.com/albetnov/forge-flutter/issues

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  sqlite_schema_forge: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

topics:
  - sqlite
  - query-builder
