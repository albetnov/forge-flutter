name: sqlite3_driver_forge
description: >-
  Background-isolate SQLite driver over package:sqlite3 with serialized access
  and SQLCipher support. Runs sqlite_query_forge and sqlite_schema_forge
  statements.
version: 0.2.0
repository: https://github.com/albetnov/forge-flutter/tree/main/packages/sqlite3_driver_forge
homepage: https://github.com/albetnov/forge-flutter
issue_tracker: https://github.com/albetnov/forge-flutter/issues

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  sqlite3: ^3.7.1
  sqlite_query_forge: ^0.4.0
  sqlite_schema_forge: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

topics:
  - sqlite
  - driver
  - isolate
