name: Dart CI

# Runs the Dart/Flutter test suites for the packages on `main` and for every
# release tag. Melos tags a release of one package as `<package>-v<version>`,
# so a tag maps to exactly one package:
#
#   fetch_forge-v*           -> fetch_forge
#   sqlite_schema_forge-v*   -> sqlite_schema_forge
#   sqlite_query_forge-v*    -> sqlite_query_forge
#   sqlite3_driver_forge-v*  -> sqlite3_driver_forge
#
# SECURITY: there is deliberately no `pull_request` trigger here. Executing
# code from a fork that targets `main` would run untrusted code on our
# runners (a supply-chain risk), so this workflow only listens to pushes to
# trusted refs.
on:
  push:
    branches:
      - main
    tags:
      - 'fetch_forge-v*'
      - 'sqlite_schema_forge-v*'
      - 'sqlite_query_forge-v*'
      - 'sqlite3_driver_forge-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The docs, the skills and the version constraints must agree with the
  # pubspecs before anything ships. The check is offline and needs no
  # Flutter or Dart toolchain, so it runs as its own job.
  #
  # It runs on the same events as the tests: the workflow deliberately has
  # no `pull_request` trigger, so the lint is the pre-publish gate rather
  # than a pre-merge gate.
  lint:
    name: Lint docs and constraints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the docs, skills and version constraints
        run: python3 tool/release_status.py --lint

  # Decide which package(s) to test: a single package for a release tag, or
  # the whole workspace for a push to `main`.
  select:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            case "${GITHUB_REF_NAME}" in
              fetch_forge-v*)          packages='["fetch_forge"]' ;;
              sqlite_schema_forge-v*)  packages='["sqlite_schema_forge"]' ;;
              sqlite_query_forge-v*)   packages='["sqlite_query_forge"]' ;;
              sqlite3_driver_forge-v*) packages='["sqlite3_driver_forge"]' ;;
              *)                       packages='[]' ;;
            esac
          else
            packages='["sqlite_schema_forge","sqlite_query_forge","sqlite3_driver_forge","fetch_forge"]'
          fi
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.package }}
    needs: select
    if: needs.select.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # fetch_forge is a Flutter package and is part of the Pub workspace,
      # so the Flutter SDK is required to resolve the workspace at the root.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      # `dart analyze <package>` walks subdirectories, including standalone
      # example apps that live outside the pub workspace. Without their own
      # `pub get`, the analyzer reports their `package:` imports as unresolved
      # errors (this is what broke fetch_forge's example/app/test).
      - name: Resolve example projects
        shell: bash
        run: |
          shopt -s globstar nullglob
          for pubspec in packages/${{ matrix.package }}/example/**/pubspec.yaml; do
            dir="$(dirname "$pubspec")"
            echo "Resolving $dir"
            (cd "$dir" && flutter pub get)
          done

      - name: Analyze
        run: dart analyze --fatal-warnings packages/${{ matrix.package }}

      - name: Test
        working-directory: packages/${{ matrix.package }}
        shell: bash
        run: |
          case "${{ matrix.package }}" in
            fetch_forge) flutter test ;;
            *)           dart test ;;
          esac
